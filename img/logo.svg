<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Pi Lab</title>
  <!-- Pi Lab logo: a hand-drawn π on a lab tile, with flow lines passing it (fluid mechanics)
       and a highlighter swipe (learning). Colours match css/tokens.css. -->
  <!-- tile: offset shadow, then the card with the site's uneven corners -->
  <path d="M18 12 H100 Q112 12 112 24 V104 Q112 114 102 114 H22 Q10 114 10 102 V22 Q10 12 18 12 Z" fill="#22252b"/>
  <path d="M14 6 H96 Q108 6 108 18 V98 Q108 108 98 108 H18 Q6 108 6 96 V16 Q6 6 14 6 Z" fill="#fffbd6" stroke="#22252b" stroke-width="4" stroke-linejoin="round"/>
  <!-- streamlines bending around the symbol -->
  <g fill="none" stroke="#3b6fd4" stroke-width="3.2" stroke-linecap="round">
    <path d="M15 31 C30 31 38 21 58 21 S88 31 99 30"/>
    <path d="M15 93 C30 93 40 101 59 101 S88 93 99 94"/>
  </g>
  <!-- highlighter swipe -->
  <path d="M22 70 C42 64 70 63 98 66 L96 82 C70 79 44 80 24 86 Z" fill="#ffe66d"/>
  <!-- the π: a wobbly bar and two legs, drawn like a marker -->
  <g fill="none" stroke="#22252b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 45 C31 40 38 38 52 38.5 S80 38 92 37"/>
    <path d="M47 39 C47 55 45 68 38 82"/>
    <path d="M73 39 C71 55 71 70 75 79 C77 84 82 85 87 81"/>
  </g>
</svg>
