# Render Blueprint: Render > New > Blueprint > pick this GitHub repository.
# Values marked  sync: false  are asked for once in Render's dashboard (they are secrets, so they are not in GitHub).
services:
  - type: web
    name: pi-lab
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir backend pilab_site.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PILAB_DEBUG
        value: "0"
      - key: PILAB_SECRET_KEY
        generateValue: true          # Render makes a long random key
      - key: ANTHROPIC_API_KEY
        sync: false                  # for the AI variable extractor (console.anthropic.com > API keys)
      - key: PILAB_EXTRACT_PER_HOUR
        value: "20"                  # AI extractor uses per visitor per hour (limits API cost)
